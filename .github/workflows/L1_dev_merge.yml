name: L1 - Build and scan (push -> dev)

on:
  push:
    branches:
      - dev

  workflow_dispatch:

permissions:
  contents: read

jobs:
  scan:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout the triggering commit
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ github.sha }}
          persist-credentials: false

      - name: Build and scan (no registry push)
        run: bash ./scripts/bgs_image_ci.sh scan
        env:
          IMAGE_REGISTRY: ${{ secrets.REG_ADDRESS }}
          REG_USERNAME: ${{ secrets.REG_USERNAME }}
          REG_PASSWORD: ${{ secrets.REG_PASSWORD }}
          REPORT_DIR: ${{ runner.temp }}/tgf-scan

      - name: Upload scan report
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: tgf-scan-report
          path: ${{ runner.temp }}/tgf-scan
          if-no-files-found: ignore