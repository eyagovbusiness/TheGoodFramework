name: L1 - Build and Publish (push -> dev)

on:
  push:
    branches:
      - dev

  workflow_dispatch:
    inputs:
      tag:
        description: "Docker image tag"
        required: false
        default: "latest"

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout TheGoodFramework repository
        uses: actions/checkout@v4
        with:
          ref: dev

      - name: Log in to image registry
        uses: docker/login-action@v2
        with:
          registry: ${{ secrets.REG_ADDRESS }}
          username: ${{ secrets.REG_USERNAME }}
          password: ${{ secrets.REG_PASSWORD }}

      - name: Build and push development image
        run: |
          chmod +x ./local_deploy.sh
          ./local_deploy.sh "${{ github.event.inputs.tag || 'latest' }}" --no-cache --bgs --registry-push
        env:
          IMAGE_REGISTRY: ${{ secrets.REG_ADDRESS }}
          OMICSFLOW_ENVIRONMENT: development
