name: Validate BGS base image reference

on:
  pull_request:
  push:
    branches: [main, dev]

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: sudo apt-get update && sudo apt-get install -y shellcheck
      - run: shellcheck local_deploy.sh scripts/validate_bgs_alpine_base_image.sh tests/validate_bgs_alpine_base_image_test.sh
      - run: bash tests/validate_bgs_alpine_base_image_test.sh
