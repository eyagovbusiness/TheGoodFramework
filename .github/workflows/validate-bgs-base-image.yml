name: BGS delivery validation

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  delivery-validation:
    name: delivery-validation
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Install ShellCheck
        run: sudo apt-get update && sudo apt-get install -y shellcheck
      - name: Lint delivery shell scripts
        run: shellcheck local_deploy.sh scripts/*.sh tests/*.sh
      - name: Test Alpine dependency pin validation
        run: bash tests/validate_bgs_alpine_base_image_test.sh
      - name: Test image publication guards
        run: bash tests/bgs_image_ci_test.sh
      - name: Test downstream notification guards
        run: bash tests/bgs_notify_common_test.sh
      - name: Test image identity, release and delivery contracts
        run: python3 -B -m unittest discover -s tests -p '*_test.py'
