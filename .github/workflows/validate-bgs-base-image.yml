name: Validate BGS image delivery

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - run: sudo apt-get update && sudo apt-get install -y shellcheck
      - run: shellcheck local_deploy.sh scripts/*.sh tests/*.sh
      - run: bash tests/validate_bgs_alpine_base_image_test.sh
      - run: bash tests/bgs_image_ci_test.sh
      - run: bash tests/bgs_notify_common_test.sh
      - run: python3 -B -m unittest discover -s tests -p '*_test.py'
