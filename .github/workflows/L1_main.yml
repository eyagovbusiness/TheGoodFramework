name: L1 - Scan and Publish canonical image (push -> main)

# The only writer of the canonical TheGoodFramework image. It runs for pushes to
# main or a dispatch on main, scans the exact built image, then publishes
# tgf-<run>.<attempt> and latest. It does not notify downstream repositories;
# consumers adopt the digest from the publication artifact through a reviewed PR.
on:
  push:
    branches:
      - main

  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: tgf-canonical-publication
  cancel-in-progress: false

jobs:
  publish:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout the triggering commit
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ github.sha }}
          persist-credentials: false

      - name: Build, scan and publish
        run: bash ./scripts/bgs_image_ci.sh publish
        env:
          IMAGE_REGISTRY: ${{ secrets.REG_ADDRESS }}
          REG_USERNAME: ${{ secrets.REG_USERNAME }}
          REG_PASSWORD: ${{ secrets.REG_PASSWORD }}
          GH_TOKEN: ${{ github.token }}
          REPORT_DIR: ${{ runner.temp }}/tgf-publication

      - name: Upload scan report and publication record
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: tgf-publication-${{ github.run_number }}.${{ github.run_attempt }}
          path: ${{ runner.temp }}/tgf-publication
          if-no-files-found: ignore