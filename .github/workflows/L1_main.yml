name: L1 - Build (push -> main)

on:
  push:
    branches:
      - main
      
  workflow_dispatch:
    inputs:
      tag:
        description: "Docker image tag"
        required: false
        default: "latest"

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout TheGoodFramework repository
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Log in to Azure Container Registry
        uses: docker/login-action@v2
        with:
          registry: ${{ secrets.REG_ADDRESS }}
          username: ${{ secrets.REG_USERNAME }}
          password: ${{ secrets.REG_PASSWORD }}

      # Keep registry login for legacy base-image pulls; BGS publication is paused.
      - name: Build with local_deploy.sh
        run: |
          chmod +x ./local_deploy.sh

          TAG="${{ github.event.inputs.tag || 'latest' }}"

          echo "Building with tag: $TAG"
          ./local_deploy.sh $TAG --no-cache --bgs
        env:
          IMAGE_REGISTRY: ${{ secrets.REG_ADDRESS }}
          OMICSFLOW_ENVIRONMENT: production
