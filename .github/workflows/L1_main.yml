name: L1 - Scan and Publish canonical image (push -> main)

# The only writer of the canonical TheGoodFramework image. It runs for pushes to
# main or a dispatch on main, scans the exact built image, then publishes
# tgf-<run>.<attempt> and latest. Only after the publisher returned successfully
# and the records were uploaded does a separate release job tag and notify OF.Common of the
# verified digest; that step alone holds the dispatch credential. OF.Common still
# adopts the digest through a reviewed PR.
on:
  push:
    branches:
      - main

  workflow_dispatch:

permissions:
  contents: read
  pull-requests: read

concurrency:
  group: tgf-canonical-publication
  cancel-in-progress: false

jobs:
  publish:
    if: github.ref == 'refs/heads/main' && github.repository == 'eyagovbusiness/TheGoodFramework'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout the triggering commit
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ github.sha }}
          persist-credentials: false

      - name: Verify reviewed protected-main authorization
        run: python3 -B ./scripts/bgs_image_release.py --authorize-source
        env:
          GH_TOKEN: ${{ github.token }}

      - name: Build, scan and publish
        id: publish
        run: bash ./scripts/bgs_image_ci.sh publish
        env:
          IMAGE_REGISTRY: ${{ secrets.REG_ADDRESS }}
          REG_USERNAME: ${{ secrets.REG_USERNAME }}
          REG_PASSWORD: ${{ secrets.REG_PASSWORD }}
          GH_TOKEN: ${{ github.token }}
          REPORT_DIR: ${{ runner.temp }}/tgf-publication

      - name: Upload scan report and publication record
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: tgf-publication-${{ github.run_number }}.${{ github.run_attempt }}
          path: ${{ runner.temp }}/tgf-publication
          if-no-files-found: ignore

  release:
    needs: publish
    if: github.ref == 'refs/heads/main' && github.repository == 'eyagovbusiness/TheGoodFramework'
    runs-on: ubuntu-latest
    # Reuse TGF's existing credential only in release/notification steps, never build/scan.
    permissions:
      contents: read
      pull-requests: read
    steps:
      - name: Checkout the triggering commit
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ github.sha }}
          persist-credentials: false

      - name: Download verified publication evidence
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093a # v4.3.0
        with:
          name: tgf-publication-${{ github.run_number }}.${{ github.run_attempt }}
          path: ${{ runner.temp }}/tgf-publication

      - name: Create immutable image Git release tag
        id: release
        run: python3 -B ./scripts/bgs_image_release.py
        env:
          GH_TOKEN: ${{ secrets.PAT_TOKEN }}
          IMAGE_REGISTRY: ${{ secrets.REG_ADDRESS }}
          REPORT_DIR: ${{ runner.temp }}/tgf-publication

      - name: Upload Git release mapping
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: tgf-release-${{ github.run_number }}.${{ github.run_attempt }}
          path: ${{ runner.temp }}/tgf-publication
          if-no-files-found: error

      # Failed publication, tag creation/readback or evidence upload announces nothing.
      - name: Notify OF.Common of the verified digest
        if: ${{ success() && steps.release.outcome == 'success' && github.ref == 'refs/heads/main' && github.repository == 'eyagovbusiness/TheGoodFramework' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch') }}
        run: bash ./scripts/bgs_notify_common.sh
        timeout-minutes: 5
        env:
          GH_TOKEN: ${{ secrets.PAT_TOKEN }}
          REQUIRE_IMAGE_RELEASE: 'true'
          IMAGE_REGISTRY: ${{ secrets.REG_ADDRESS }}
          REPORT_DIR: ${{ runner.temp }}/tgf-publication
