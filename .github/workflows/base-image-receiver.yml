name: Verified base image receiver

on:
  repository_dispatch:
    types: [base-image-published-v1]
  schedule:
    - cron: '13 4 * * *'
  workflow_dispatch:
    inputs:
      dry_run:
        description: Verify evidence and target layouts without creating proposals
        type: boolean
        default: true

permissions:
  contents: read
  pull-requests: read

concurrency:
  group: verified-base-image-receiver
  cancel-in-progress: false

jobs:
  receive:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      DRY_RUN: ${{ github.event_name == 'workflow_dispatch' && inputs.dry_run && 'true' || 'false' }}
    steps:
      # Only main's reviewed code runs. Target Dockerfiles are API-read blobs, never executed.
      - name: Check out trusted receiver
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Validate notification without credentials
        id: validate
        run: python3 -B scripts/base_image_receiver.py validate-event
      - name: Verify source publication, registry and target layouts
        id: plan
        if: steps.validate.outputs.paused != 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          GH_SOURCE_TOKEN: ${{ secrets.BASE_IMAGE_SOURCE_READ_TOKEN || secrets.PAT_TOKEN }}
          REGISTRY_PULL_USERNAME: ${{ secrets.BASE_IMAGE_PULL_USERNAME || secrets.REG_USERNAME }}
          REGISTRY_PULL_PASSWORD: ${{ secrets.BASE_IMAGE_PULL_USERNAME && secrets.BASE_IMAGE_PULL_PASSWORD || !secrets.BASE_IMAGE_PULL_USERNAME && secrets.REG_PASSWORD }}
        run: python3 -B scripts/base_image_receiver.py plan
      # Reuse the same cross-owner identity as the existing TGF release/notification workflow.
      - name: Create reviewed digest proposals
        if: steps.plan.outputs.has_proposals == 'true'
        env:
          GH_TOKEN: ${{ secrets.PAT_TOKEN }}
        run: python3 -B scripts/base_image_receiver.py propose
